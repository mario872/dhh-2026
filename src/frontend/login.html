<html lang="en">
<head>
    <title>AI Usage Monitor</title>
    <link href="main.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div class="topnavcontainer">
        <div class="image"> 
                <a href="index.html"><img style="vertical-align:middle" src="icon.png"></a>
            </div>
        <div class="navGroup">
            <nav>
                <a style="padding-right: 8%; padding-left: 0%;" class="tnb-nav-btn" href="monitor.html">Monitor</a>
                <a style="padding-right: 8%; padding-left: 0%;" class="tnb-nav-btn" href="playground.html">Playground</a>
                <a style="padding-right: 8%; padding-left: 0%;" class="tnb-nav-btn" href="login.html">Login</a>
            </nav>
        </div>
        <div class="text">
            <h1>AI Usage Monitor</h1>
        </div>
    </div>

    <h2 style="font-weight: bold;">Log In to Your Account:</h2>
    
    <div class="login-wrapper" style="font-family: sans-serif; max-width: 300px; align-items: center;">
        <div id="login-container" class="login-form" style="margin-bottom: 15px; align-items: center;">
            <label for="account-input" style="display: block; margin-bottom: 6px; font-size: 0.9rem; font-weight: bold;">Account:</label>
            <input id="account-input" type="text" list="user-list" placeholder="Start typing your username" autocomplete="off" style="box-sizing: border-box; width: 240px; padding: 10px; border: 1px solid #bcbcbc; border-radius: 4px;">
            <datalist id="user-list"></datalist>
            <div id="account-message" role="status" style="font-size: 0.9rem; margin-top: 5px;"></div>
        </div>

        <div id="password-container" style="display: none; flex-direction: column; gap: 10px; width: 240px;">
            <label for="password-input" style="font-size: 0.9rem; font-weight: bold;">Password:</label>
            <input type="password" id="password-input" placeholder="Enter password" style="padding: 10px; border: 1px solid #bcbcbc; border-radius: 4px;">
            <button id="submit-login" style="padding: 10px; background-color: #0c4c34; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
                Sign In
            </button>
            <div id="login-message" style="font-size: 0.9rem; margin-top: 5px;"></div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const accountInput = document.getElementById('account-input');
            const userList = document.getElementById('user-list');
            const accountMessage = document.getElementById('account-message');
            
            const passwordContainer = document.getElementById('password-container');
            const passwordInput = document.getElementById('password-input');
            const submitLogin = document.getElementById('submit-login');
            const loginMessage = document.getElementById('login-message');
            
            let selectedUser = null;
            let students = [];

            if (!accountInput || !userList || !accountMessage || !passwordContainer || !passwordInput || !submitLogin || !loginMessage) return;

            function updateAccountSelection() {
                const username = accountInput.value.trim().toLowerCase();
                const matchingUser = students.find(student => student.user_name.toLowerCase() === username) || null;

                if (matchingUser !== selectedUser) {
                    selectedUser = matchingUser;
                    passwordInput.value = '';
                    loginMessage.textContent = '';
                }

                passwordContainer.style.display = selectedUser ? 'flex' : 'none';
            }

            fetch('http://127.0.0.1:8000/students')
                .then(response => {
                    if (!response.ok) throw new Error('Could not load accounts');
                    return response.json();
                })
                .then(apiResponse => {
                    const studentsArray = Array.isArray(apiResponse) ? apiResponse : (apiResponse.students || apiResponse.data || Object.values(apiResponse));
                    
                    if (!Array.isArray(studentsArray) || studentsArray.length === 0) {
                        accountMessage.style.color = 'red';
                        accountMessage.textContent = 'No accounts found.';
                        return;
                    }

                    students = studentsArray.filter(student =>
                        student && typeof student === 'object' && typeof student.user_name === 'string'
                    );

                    students.forEach(student => {
                        const option = document.createElement('option');
                        option.value = student.user_name;
                        userList.appendChild(option);
                    });

                    if (students.length === 0) {
                        accountMessage.style.color = 'red';
                        accountMessage.textContent = 'No accounts found.';
                    }
                    updateAccountSelection();
                })
                .catch(error => {
                    console.error('Error loading user data:', error);
                    accountMessage.style.color = 'red';
                    accountMessage.textContent = 'Error loading accounts. Please try again later.';
                });

            accountInput.addEventListener('input', () => {
                updateAccountSelection();
            });

            submitLogin.addEventListener('click', () => {
                if (!selectedUser) return;

                if (passwordInput.value === '1234') {
                    loginMessage.style.color = 'green';
                    loginMessage.textContent = 'Success! Redirecting...';
                    
                    localStorage.setItem('currentUser', JSON.stringify({
                        id: selectedUser.id,
                        user_name: selectedUser.user_name,
                        loggedInAt: new Date().toISOString()
                    }));

                    window.location.href = 'monitor.html';
                }
                if (passwordInput.value === '2345') {
                    loginMessage.style.color = 'green';
                    loginMessage.textContent = 'Success! Redirecting...';
                    
                    localStorage.setItem('currentUser', JSON.stringify({
                        id: 1,
                        user_name: 'admin',
                        loggedInAt: new Date().toISOString()
                    }));

                    window.location.href = 'admin.html';
                    }
                else {
                    loginMessage.style.color = 'red';
                    loginMessage.textContent = 'Incorrect password. Hint: Try 1234';
                }
            });
            
            passwordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    submitLogin.click();
                }
            });
        });
    </script>
</body>
</html>
