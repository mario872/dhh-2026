<html lang="en">
    <head>
        <title>AI Usage Monitor</title>
        <link href="main.css" rel="stylesheet">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div class="topnavcontainer">
            <div class="navGroup"> 
                <nav>
                    <a style="padding-right: 8%; padding-left: 0%;" class="tnb-nav-btn" href="monitor.html">Monitor</a> 
                    <a style="padding-right: 8%; padding-left: 0%;" class="tnb-nav-btn" href="playground.html">Playground</a>
                    <a style="padding-right: 8%; padding-left: 0%;" class="tnb-nav-btn" href="login.html">Login</a> 
                </nav>
               </div>
               <div class="text">
                <h1>AI Usage Monitor</h1>
            </div>  
        </div>
        <h2 style="font-weight: bold;">Your Usage This Month</h2>
        <h3 style="font-weight: bold;" id="username">...</h3>
        <div class="grid-container">
            <div class="box">
                <span class="box-heading">Messages Sent</span><br/>
                <span class="box-value" id="messages-sent">...</span>
            </div>
            <div class="box">
                <span class="box-heading">Tokens Used</span><br/>
                <span class="box-value" id="tokens-used">...</span>
            </div>
            <div class="box">
                <span class="box-heading">Liters of water used</span><br/>
                <span class="box-value" id="water-used">...</span>
            </div>
            <div class="box">
                <span class="box-heading">Message Cost</span><br/>
                <span class="box-value" id="message-cost">...</span>
            </div>
        </div>
       <script>
    // 1. Retrieve the session payload from localStorage
    const sessionData = localStorage.getItem('currentUser');
    
    // 2. Enforce authentication safeguard context
    if (!sessionData) {
        // Kick unauthenticated traffic back to login
        alert('Please log in first.');
        window.location.href = 'login.html';
    }

    // 3. Parse data safely to grab the dynamic database identifier 
    const currentUser = JSON.parse(sessionData);
    const CURRENT_STUDENT_ID = currentUser.id; 
    const currentName = currentUser.user_name

    // Optional: Personalise your UI by showing their name somewhere
    console.log(`Loading metrics data context dynamically for: ${currentUser.user_name}`);

    async function loadUsageData() {
        try {
            // Inject the dynamic ID straight into the API URL string
            const response = await fetch(`http://127.0.0.1:8000/student/${CURRENT_STUDENT_ID}/usage`);
            
            if (!response.ok) {
                throw new Error('Could not fetch student usage details');
            }

            const data = await response.json();
            const usage = data.usage;
            const totalMessages = usage.user.all.length;
            const waterEstimation = usage.raw_tokens * 0.002;

            document.getElementById('messages-sent').innerText = totalMessages;
            document.getElementById('tokens-used').innerText = usage.raw_tokens.toLocaleString();
            document.getElementById('water-used').innerText = waterEstimation.toFixed(1);
            document.getElementById('message-cost').innerText = `$${usage.cost.toFixed(4)}`;
            document.getElementById('username').innerText = currentName;

        } catch (error) {
            console.error("Error connecting to backend API:", error);
            document.getElementById('messages-sent').innerText = 'Err';
            document.getElementById('tokens-used').innerText = 'Err';
            document.getElementById('water-used').innerText = 'Err';
            document.getElementById('message-cost').innerText = 'Err';
        }
    }
    window.addEventListener('DOMContentLoaded', loadUsageData);
    </script>
    </body>
</html>
